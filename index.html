        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });

async function updateDeviceList() {
    const devices = await navigator.mediaDevices.enumerateDevices();
    videoSelect.innerHTML = ''; 
    audioSelect.innerHTML = '';
    devices.forEach(device => {
        const option = document.createElement('option'); 
        option.value = device.deviceId;
        if (device.kind === 'videoinput') { 
            option.text = device.label || `Камера ${videoSelect.length + 1}`; 
            videoSelect.appendChild(option); 
        } else if (device.kind === 'audioinput') { 
            option.text = device.label || `Мікрофон ${audioSelect.length + 1}`; 
            audioSelect.appendChild(option); 
        }
    });
}

async function changeDevices() {
    if (localStream) localStream.getTracks().forEach(track => track.stop());
    localStream = await navigator.mediaDevices.getUserMedia({

    }
}

async function initWebRTC(isCreator) {
    peerConnection = new RTCPeerConnection(rtcConfig);
    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
    
    peerConnection.ontrack = (e) => {

    peerConnection.onicecandidate = (e) => { 
        if (e.candidate) socket.emit('signal', { candidate: e.candidate });

    socket.on('signal', async (d) => {
        if (!peerConnection) return;
        if (d.sdp) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(d.sdp));
            if (d.sdp.type === 'offer') { 
                const ans = await peerConnection.createAnswer(); 
                await peerConnection.setLocalDescription(ans); 
                socket.emit('signal', { sdp: peerConnection.localDescription }); 
            }
        } else if (d.candidate) { 
            await peerConnection.addIceCandidate(new RTCIceCandidate(d.candidate)); 
        }
    });
    
    if (isCreator) { 
        const offer = await peerConnection.createOffer(); 
        await peerConnection.setLocalDescription(offer); 
        socket.emit('signal', { sdp: peerConnection.localDescription }); 
    }
}

const express = require('express');
const app = express();
const http = require('http').createServer(app);
const io = require('socket.io')(http, { cors: { origin: "*" } });

// ВАШ ОФІЦІЙНИЙ TELEGRAM ID ЯК РОЗРОБНИКА
const ADMIN_TG_ID = 7858510682; 

let waitingUsers = []; 
let bannedUsers = new Map(); // Map(tgId -> { expiresAt: Date, reason: String })
let userDatabase = new Map(); // Map(tgId -> { firstSeen: Date, callsCount: Number, reportsCount: Number, isVerified: Boolean })

io.on('connection', (socket) => {

    socket.on('auth', (tgData) => {
        socket.tgId = tgData.id;
        socket.username = tgData.first_name;
        socket.customNick = tgData.custom_nick || tgData.first_name;
        socket.customAge = tgData.custom_age || 18;

        if (!userDatabase.has(socket.tgId)) {
            userDatabase.set(socket.tgId, {
                firstSeen: new Date(),
                callsCount: 0,
                reportsCount: 0,
                isVerified: (socket.tgId === ADMIN_TG_ID) // Ви верифіковані автоматично
            });
        }

        socket.isVerified = userDatabase.get(socket.tgId).isVerified;

        // ПЕРЕВІРКА НА ТИМЧАСОВИЙ АБО ПОСТІЙНИЙ БАН
        if (bannedUsers.has(socket.tgId)) {
            const banInfo = bannedUsers.get(socket.tgId);
            const now = new Date();
            if (now < banInfo.expiresAt) {
                const timeLeft = Math.round((banInfo.expiresAt - now) / 1000 / 60);
                socket.emit('banned', { reason: banInfo.reason, timeLeft: `${timeLeft} хв.` });
                socket.disconnect();
                return;
            } else {
                bannedUsers.delete(socket.tgId);
            }
        }

        // ПЕРЕВІРКА СТАТУСУ РОЗРОБНИКА
        if (socket.tgId === ADMIN_TG_ID) {
            socket.isAdmin = true;
            socket.emit('admin_verified');

    socket.on('next_user', () => {

            socket.to(socket.room).emit('peer_disconnected');
            socket.leave(socket.room);
            socket.room = null;

        if (userDatabase.has(socket.tgId)) {

        socket.isVerified = true;
        userDatabase.set(socket.tgId, profile);
        socket.emit('verification_result', { success: true, message: "🎉 Вітаємо! Всі умови виконано. Вам видано синю блискучу галочку! ✓" });
    });

    // АДМІН-ФУНКЦІЇ РОЗРОБНИКА
    socket.on('admin_mute_peer', (type) => {
        if (socket.isAdmin && socket.room) socket.to(socket.room).emit('force_mute', { type });
    });

    socket.on('admin_action', (data) => {
        if (!socket.isAdmin) return;
        if (data.action === 'ban_current' && socket.room) {
            const roomSockets = io.sockets.adapter.rooms.get(socket.room);
            let peerSocketId = [...roomSockets].find(id => id !== socket.id);
            let peerSocket = io.sockets.sockets.get(peerSocketId);

            if (peerSocket) {
                const expiresAt = new Date();
                expiresAt.setMinutes(expiresAt.getMinutes() + data.durationMinutes);
                bannedUsers.set(peerSocket.tgId, { expiresAt, reason: data.reason }); // Причина записується обов'язково
                
                peerSocket.emit('banned', { reason: data.reason, timeLeft: data.durationText });
                peerSocket.disconnect();
                socket.emit('admin_msg', `Користувача забанено за причиною: ${data.reason}`);
            }
        } else if (data.action === 'unban_by_id') {
            bannedUsers.delete(parseInt(data.targetId));
            socket.emit('admin_msg', `Користувача успішно розбанено.`);
        }
    });

    // СКАРГИ ВІД ЗВИЧАЙНИХ ЮЗЕРІВ
    socket.on('report_peer', () => {
        if (!socket.room) return;
        const roomSockets = io.sockets.adapter.rooms.get(socket.room);
        let peerId = [...roomSockets].find(id => id !== socket.id);
        let peerSocket = io.sockets.sockets.get(peerId);
        if (peerSocket) {
            const profile = userDatabase.get(peerSocket.tgId);
            profile.reportsCount += 1;
            userDatabase.set(peerSocket.tgId, profile);

            if (profile.reportsCount >= 3) {
                const exp = new Date(); exp.setHours(exp.getHours() + 24); // Автобан на 24 години за 3 скарги
                bannedUsers.set(peerSocket.tgId, { expiresAt: exp, reason: "Автобан за 3 скарги користувачів" });
                peerSocket.emit('banned', { reason: "Автобан за скарги", timeLeft: "24 год." });
                peerSocket.disconnect();
            }
            socket.emit('report_success');
        }
    });

    socket.on('disconnect', () => {
        waitingUsers = waitingUsers.filter(id => id !== socket.id);
        if (socket.room) socket.to(socket.room).emit('peer_disconnected');
    });
    socket.on('signal', (data) => { if (socket.room) socket.to(socket.room).emit('signal', data); });
});

http.listen(3000, () => console.log('Сервер чат-рулетки працює на порту 3000'));
